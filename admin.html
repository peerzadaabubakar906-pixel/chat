<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14262E;
    --muted: #5C7079;
    --bg: #E9EFF1;
    --panel: #FFFFFF;
    --line: #D2DCE0;
    --teal: #0E6F68;
    --teal-ink: #FFFFFF;
    --amber: #E8A33D;
    --danger: #B3372B;
    --sel: #E1F0EE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E4EEF1;
      --muted: #8FA5AE;
      --bg: #0E1A1F;
      --panel: #16272E;
      --line: #263B44;
      --teal: #2BA79D;
      --teal-ink: #062522;
      --sel: #1D3A3B;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .center { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .card h1 { margin: 0 0 18px; font-size: 26px; letter-spacing: -0.01em; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  .field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  .btn { padding: 12px 16px; border: 0; border-radius: 10px; background: var(--teal); color: var(--teal-ink); font-weight: 700; cursor: pointer; }
  .btn.full { width: 100%; margin-top: 18px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { margin-top: 12px; min-height: 1.2em; font-size: 14px; color: var(--danger); }

  /* Dashboard */
  .app { height: 100dvh; display: grid; grid-template-columns: 320px 1fr; background: var(--panel); }
  .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .side header strong { font-size: 18px; }
  .linkbtn { background: none; border: 0; padding: 6px 8px; color: var(--teal); font-weight: 600; cursor: pointer; border-radius: 8px; }
  .linkbtn.danger { color: var(--danger); }
  .chats { overflow-y: auto; flex: 1; }
  .chatrow { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
  .chatrow:hover { background: var(--bg); }
  .chatrow[aria-current="true"] { background: var(--sel); }
  .chatrow .main { flex: 1; min-width: 0; }
  .chatrow .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .chatrow .nm time { font-weight: 400; font-size: 12px; color: var(--muted); flex: none; }
  .chatrow .last { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatrow.unread .nm, .chatrow.unread .last { color: var(--ink); font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: none; }
  .none { padding: 24px 16px; color: var(--muted); line-height: 1.45; }

  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane .blank { margin: auto; color: var(--muted); text-align: center; padding: 20px; }
  .pane header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .pane header strong { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { display: none; }
  .list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg small { display: block; margin-top: 3px; font-size: 11px; opacity: .65; white-space: normal; }
  .msg.visitor { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 5px; }
  .msg.admin { align-self: flex-end; background: var(--teal); color: var(--teal-ink); border-bottom-right-radius: 5px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; max-height: 120px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .status { padding: 0 16px 8px; min-height: 1.4em; font-size: 13px; color: var(--danger); }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .app .pane { display: none; }
    .app.open .side { display: none; }
    .app.open .pane { display: flex; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>

<!-- Login -->
<main class="center" id="loginScreen" hidden>
  <form class="card" id="loginForm">
    <h1>Inbox login</h1>
    <label for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="username" required>
    <label for="pass">Password</label>
    <input class="field" id="pass" type="password" autocomplete="current-password" required>
    <button class="btn full" id="loginBtn" type="submit">Log in</button>
    <div class="note" id="loginNote" role="alert"></div>
  </form>
</main>

<!-- Dashboard -->
<div class="app" id="app" hidden>
  <aside class="side">
    <header>
      <strong>Inbox</strong>
      <button class="linkbtn" id="logout" type="button">Log out</button>
    </header>
    <div class="chats" id="chats"></div>
  </aside>

  <section class="pane">
    <div class="blank" id="blank">Pick a chat on the left to read and reply.</div>
    <header id="paneHead" hidden>
      <button class="linkbtn back" id="back" type="button">Back</button>
      <strong id="paneName"></strong>
      <button class="linkbtn danger" id="del" type="button">Delete chat</button>
    </header>
    <div class="list" id="list" aria-live="polite" hidden></div>
    <div class="status" id="status" role="alert"></div>
    <form class="composer" id="replyForm" autocomplete="off" hidden>
      <textarea id="reply" rows="1" maxlength="1000" placeholder="Type a reply" aria-label="Reply"></textarea>
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
</div>

<!-- Config error -->
<main class="center" id="fatal" hidden>
  <div class="card"><h1>Not ready</h1><p id="fatalText"></p></div>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, addDoc, updateDoc, deleteDoc, getDocs, collection, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const cfg = window.FIREBASE_CONFIG;

if (!cfg || JSON.stringify(cfg).includes("PASTE_")) {
  $("fatalText").textContent = "Open firebase-config.js and paste your Firebase keys there.";
  $("fatal").hidden = false;
  throw new Error("Firebase config missing");
}

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);

let unsubChats = null;
let unsubMsgs = null;
let selectedId = null;
let chatData = new Map();
let firstLoad = true;
let audioCtx = null;

/* ---------- Login ---------- */
onAuthStateChanged(auth, (user) => {
  if (user && !user.isAnonymous) {
    $("loginScreen").hidden = true;
    $("app").hidden = false;
    startDashboard();
  } else {
    stopDashboard();
    $("app").hidden = true;
    $("loginScreen").hidden = false;
  }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginBtn").disabled = true;
  $("loginNote").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    ensureAudio();
  } catch (err) {
    $("loginNote").textContent = "Wrong email or password.";
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("logout").addEventListener("click", () => signOut(auth));

/* ---------- Helpers ---------- */
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}

function beep() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.value = 880;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
  o.connect(g).connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.4);
}

function shortTime(ts) {
  if (!ts) return "";
  const d = ts.toDate();
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  return d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function fullTime(ts) {
  if (!ts) return "";
  return ts.toDate().toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}

/* ---------- Chat list ---------- */
function startDashboard() {
  if (unsubChats) return;
  firstLoad = true;
  const q = query(collection(db, "chats"), orderBy("lastMessageAt", "desc"));
  unsubChats = onSnapshot(q, (snap) => {
    chatData = new Map();
    snap.forEach((d) => chatData.set(d.id, d.data({ serverTimestamps: "estimate" })));

    if (!firstLoad) {
      snap.docChanges().forEach((c) => {
        if (c.type === "removed" || c.doc.metadata.hasPendingWrites) return;
        const data = c.doc.data();
        if (data.unread && c.doc.id !== selectedId) beep();
      });
    }
    firstLoad = false;

    renderChats();

    if (selectedId) {
      const cur = chatData.get(selectedId);
      if (!cur) closeChat();
      else if (cur.unread) updateDoc(doc(db, "chats", selectedId), { unread: false }).catch(() => {});
    }
  }, () => {
    $("chats").innerHTML = "";
    const n = document.createElement("div");
    n.className = "none";
    n.textContent = "Could not load chats. Check your Firestore rules and admin email.";
    $("chats").appendChild(n);
  });
}

function stopDashboard() {
  if (unsubChats) { unsubChats(); unsubChats = null; }
  closeChat();
  chatData = new Map();
  document.title = "Inbox";
}

function renderChats() {
  const wrap = $("chats");
  wrap.textContent = "";
  let unread = 0;

  if (chatData.size === 0) {
    const n = document.createElement("div");
    n.className = "none";
    n.textContent = "No chats yet. Share your chat link and messages will show up here.";
    wrap.appendChild(n);
  }

  chatData.forEach((c, id) => {
    if (c.unread) unread++;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chatrow" + (c.unread ? " unread" : "");
    if (id === selectedId) b.setAttribute("aria-current", "true");

    const main = document.createElement("div");
    main.className = "main";
    const nm = document.createElement("div");
    nm.className = "nm";
    const nameSpan = document.createElement("span");
    nameSpan.textContent = c.name || "Visitor";
    const t = document.createElement("time");
    t.textContent = shortTime(c.lastMessageAt);
    nm.append(nameSpan, t);
    const last = document.createElement("div");
    last.className = "last";
    last.textContent = c.lastText || "Just joined";
    main.append(nm, last);
    b.appendChild(main);

    if (c.unread) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.title = "New message";
      b.appendChild(dot);
    }
    b.addEventListener("click", () => openChat(id));
    wrap.appendChild(b);
  });

  document.title = unread ? "(" + unread + ") Inbox" : "Inbox";
}

/* ---------- Conversation ---------- */
function openChat(id) {
  ensureAudio();
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  selectedId = id;
  const c = chatData.get(id) || {};
  $("blank").hidden = true;
  $("paneHead").hidden = false;
  $("list").hidden = false;
  $("replyForm").hidden = false;
  $("paneName").textContent = c.name || "Visitor";
  $("status").textContent = "";
  $("app").classList.add("open");
  renderChats();

  if (c.unread) updateDoc(doc(db, "chats", id), { unread: false }).catch(() => {});

  const q = query(collection(db, "chats", id, "messages"), orderBy("ts"));
  unsubMsgs = onSnapshot(q, (snap) => {
    const list = $("list");
    list.textContent = "";
    snap.forEach((d) => {
      const m = d.data({ serverTimestamps: "estimate" });
      const b = document.createElement("div");
      b.className = "msg " + (m.from === "admin" ? "admin" : "visitor");
      b.textContent = m.text;
      const t = document.createElement("small");
      t.textContent = fullTime(m.ts);
      b.appendChild(t);
      list.appendChild(b);
    });
    list.scrollTop = list.scrollHeight;
  }, () => {
    $("status").textContent = "Could not load this conversation.";
  });
  $("reply").focus();
}

function closeChat() {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  selectedId = null;
  $("blank").hidden = false;
  $("paneHead").hidden = true;
  $("list").hidden = true;
  $("list").textContent = "";
  $("replyForm").hidden = true;
  $("app").classList.remove("open");
  renderChats();
}

$("back").addEventListener("click", closeChat);

const box = $("reply");
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 120) + "px";
});
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("replyForm").requestSubmit();
  }
});

$("replyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = box.value.trim().slice(0, 1000);
  if (!text || !selectedId) return;
  const id = selectedId;
  box.value = "";
  box.style.height = "auto";
  $("status").textContent = "";
  try {
    await addDoc(collection(db, "chats", id, "messages"), { from: "admin", text, ts: serverTimestamp() });
    await updateDoc(doc(db, "chats", id), { lastText: "You: " + text.slice(0, 74), lastMessageAt: serverTimestamp(), unread: false });
  } catch (err) {
    box.value = text;
    $("status").textContent = "Reply not sent. Check your connection and try again.";
  }
});

$("del").addEventListener("click", async () => {
  if (!selectedId) return;
  if (!confirm("Delete this whole chat? This cannot be undone.")) return;
  const id = selectedId;
  try {
    const msgs = await getDocs(collection(db, "chats", id, "messages"));
    await Promise.all(msgs.docs.map((d) => deleteDoc(d.ref)));
    await deleteDoc(doc(db, "chats", id));
    closeChat();
  } catch (err) {
    $("status").textContent = "Could not delete this chat. Try again.";
  }
});
</script>
</body>
</html>
