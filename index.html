<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Message me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14262E;
    --muted: #5C7079;
    --bg: #E9EFF1;
    --panel: #FFFFFF;
    --line: #D2DCE0;
    --teal: #0E6F68;
    --teal-ink: #FFFFFF;
    --amber: #E8A33D;
    --danger: #B3372B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E4EEF1;
      --muted: #8FA5AE;
      --bg: #0E1A1F;
      --panel: #16272E;
      --line: #263B44;
      --teal: #2BA79D;
      --teal-ink: #062522;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* Name screen */
  .center { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px;
  }
  .card h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; }
  .card p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg);
  }
  .btn {
    width: 100%; margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 10px;
    background: var(--teal); color: var(--teal-ink); font-weight: 700; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { margin-top: 12px; min-height: 1.2em; font-size: 14px; color: var(--danger); }

  /* Chat screen */
  .chat { height: 100dvh; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .top strong { display: block; font-size: 17px; }
  .top span { font-size: 13px; color: var(--muted); }
  .linkbtn { background: none; border: 0; padding: 6px 8px; color: var(--teal); font-weight: 600; cursor: pointer; border-radius: 8px; }
  .list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 260px; line-height: 1.45; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg small { display: block; margin-top: 3px; font-size: 11px; opacity: .65; white-space: normal; }
  .msg.visitor { align-self: flex-end; background: var(--teal); color: var(--teal-ink); border-bottom-right-radius: 5px; }
  .msg.admin { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 5px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; max-height: 120px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .composer .btn { width: auto; margin: 0; padding: 0 20px; }
  .status { padding: 0 16px 8px; min-height: 1.4em; font-size: 13px; color: var(--danger); }
</style>
</head>
<body>

<!-- Step 1: temporary name -->
<main class="center" id="nameScreen" hidden>
  <form class="card" id="nameForm" autocomplete="off">
    <h1>Message me</h1>
    <p>Pick any name you like. It only shows up in this chat, and I will reply right here.</p>
    <label for="nameInput">Your name</label>
    <input class="field" id="nameInput" maxlength="30" placeholder="e.g. Ali" required>
    <button class="btn" id="nameBtn" type="submit">Start chat</button>
    <div class="note" id="nameNote" role="alert"></div>
  </form>
</main>

<!-- Step 2: chat -->
<section class="chat" id="chatScreen" hidden>
  <header class="top">
    <div>
      <strong>Chat</strong>
      <span>You are <b id="who"></b></span>
    </div>
    <button class="linkbtn" id="renameBtn" type="button">Change name</button>
  </header>
  <div class="list" id="list" aria-live="polite"></div>
  <div class="status" id="status" role="alert"></div>
  <form class="composer" id="sendForm" autocomplete="off">
    <textarea id="text" rows="1" maxlength="1000" placeholder="Type a message" aria-label="Message"></textarea>
    <button class="btn" type="submit">Send</button>
  </form>
</section>

<!-- Loading / config errors -->
<main class="center" id="fatal" hidden>
  <div class="card"><h1>Chat is not ready</h1><p id="fatalText"></p></div>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const cfg = window.FIREBASE_CONFIG;

if (!cfg || JSON.stringify(cfg).includes("PASTE_")) {
  $("fatalText").textContent = "Open firebase-config.js and paste your Firebase keys there.";
  $("fatal").hidden = false;
  throw new Error("Firebase config missing");
}

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);

let uid = null;
let name = localStorage.getItem("chat_name") || "";
let unsub = null;
let started = false;

signInAnonymously(auth).catch(() => {
  $("fatalText").textContent = "Could not connect. Check your internet and reload the page.";
  $("fatal").hidden = false;
});

onAuthStateChanged(auth, (user) => {
  if (!user || started) return;
  started = true;
  uid = user.uid;
  name ? openChat() : showName();
});

function showName() {
  $("chatScreen").hidden = true;
  $("nameScreen").hidden = false;
  $("nameInput").value = name;
  $("nameInput").focus();
}

function openChat() {
  $("nameScreen").hidden = true;
  $("chatScreen").hidden = false;
  $("who").textContent = name;
  subscribe();
  $("text").focus();
}

function subscribe() {
  if (unsub) return;
  const q = query(collection(db, "chats", uid, "messages"), orderBy("ts"));
  unsub = onSnapshot(q, render, () => {
    $("status").textContent = "Could not load messages. Reload the page.";
  });
}

function timeLabel(ts) {
  if (!ts) return "";
  return ts.toDate().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function render(snap) {
  const list = $("list");
  list.textContent = "";
  if (snap.empty) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No messages yet. Say hello below.";
    list.appendChild(e);
    return;
  }
  snap.forEach((d) => {
    const m = d.data({ serverTimestamps: "estimate" });
    const b = document.createElement("div");
    b.className = "msg " + (m.from === "admin" ? "admin" : "visitor");
    b.textContent = m.text;
    const t = document.createElement("small");
    t.textContent = timeLabel(m.ts);
    b.appendChild(t);
    list.appendChild(b);
  });
  list.scrollTop = list.scrollHeight;
}

$("nameForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const n = $("nameInput").value.trim().slice(0, 30);
  if (!n) return;
  $("nameBtn").disabled = true;
  $("nameNote").textContent = "";
  try {
    const ref = doc(db, "chats", uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      await setDoc(ref, { name: n }, { merge: true });
    } else {
      await setDoc(ref, { name: n, createdAt: serverTimestamp(), lastMessageAt: serverTimestamp(), lastText: "", unread: false });
    }
    name = n;
    localStorage.setItem("chat_name", name);
    openChat();
  } catch (err) {
    $("nameNote").textContent = "Could not start the chat. (" + (err.code || err.message) + ")";
  } finally {
    $("nameBtn").disabled = false;
  }
});

$("renameBtn").addEventListener("click", showName);

const box = $("text");
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 120) + "px";
});
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("sendForm").requestSubmit();
  }
});

$("sendForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = box.value.trim().slice(0, 1000);
  if (!text) return;
  box.value = "";
  box.style.height = "auto";
  $("status").textContent = "";
  try {
    await addDoc(collection(db, "chats", uid, "messages"), { from: "visitor", text, ts: serverTimestamp() });
    await setDoc(doc(db, "chats", uid), { name, lastText: text.slice(0, 80), lastMessageAt: serverTimestamp(), unread: true }, { merge: true });
  } catch (err) {
    box.value = text;
    $("status").textContent = "Message not sent. Check your connection and try again.";
  }
});
</script>
</body>
</html>
